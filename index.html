<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Free Short Drama</title>
<meta name="description" content="Free short dramas, one episode at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--card:#141414;--line:#2b2b2b;--cream:#f3eee6;--red:#c8102e;--mut:#9b9b9b;--txt:#f3eee6}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:var(--txt);font-family:Outfit,system-ui,sans-serif}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
svg{display:block}
#app{position:relative;max-width:480px;min-height:100dvh;margin:0 auto;background:var(--bg);overflow-x:hidden;padding-bottom:112px}
#app.bare{padding-bottom:0}
.serif{font-family:'Playfair Display',Georgia,serif;font-weight:700}
.kick{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}

/* splash */
.splash{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 40% 52%,rgba(150,20,40,.38),#000 55%);display:flex;align-items:center;transition:opacity .5s}
.splash.out{opacity:0}
.sp-in{display:flex;gap:12px;padding-left:max(28px,calc(50vw - 200px))}
.sp-bar{width:3px;background:var(--red)}
.sp-in small{display:block;font-size:13px;font-weight:600;letter-spacing:.3em}
.sp-in b{display:block;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:46px;line-height:1.05;letter-spacing:1px;clip-path:inset(0 100% 0 0);animation:rev 1s .3s forwards}
.sp-in u{display:block;height:2px;width:0;background:var(--red);margin-top:6px;animation:ul .6s .9s forwards}
@keyframes rev{to{clip-path:inset(0 0 0 0)}}
@keyframes ul{to{width:96px}}

/* covers */
.cover{position:relative;aspect-ratio:16/25;border-radius:5px;overflow:hidden;background:var(--g)}
.cover.fill{position:absolute;inset:0;aspect-ratio:auto;border-radius:0}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;z-index:1}
.cover .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-family:'Playfair Display',serif;font-weight:700;font-size:17px;line-height:1.2}
.poster{position:relative;display:block}
.hbtn{position:absolute;z-index:3;top:6px;left:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
.hbtn[aria-pressed="true"]{color:var(--red)}
.pep{position:absolute;z-index:2;top:9px;right:8px;font-size:10px;font-weight:600;letter-spacing:.05em;text-shadow:0 1px 3px #000}
.px{position:absolute;z-index:3;top:22px;right:4px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#fff;filter:drop-shadow(0 1px 2px #000)}
.pbar{position:absolute;z-index:3;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25);border-radius:0 0 5px 5px}
.pbar b{display:block;height:100%;background:var(--red)}

/* home */
.hero{position:relative;height:min(76dvh,720px);background:#000}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;scroll-snap-align:start;overflow:hidden}
.slide .shade{position:absolute;inset:0;z-index:2;background:linear-gradient(rgba(8,8,8,.6),transparent 22%,transparent 52%,var(--bg) 96%)}
.brand{position:absolute;z-index:4;top:22px;left:18px;display:flex;gap:9px}
.brand i{width:3px;height:36px;background:var(--red)}
.brand small{display:block;font-size:10px;font-weight:600;letter-spacing:.25em}
.brand b{display:block;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:21px;line-height:1;letter-spacing:1.2px}
.brand u{display:block;width:22px;height:2px;background:var(--red);margin-top:4px}
.slide .hbtn{top:66px;left:14px}
.slide .cnt{position:absolute;z-index:4;top:70px;right:18px;font-size:10px;font-weight:500;color:#bbb;letter-spacing:.05em}
.cs{position:absolute;z-index:4;left:0;right:0;bottom:44px;text-align:center}
.cs .kick{display:inline-block;padding-bottom:3px;border-bottom:2px solid var(--red);margin-bottom:12px}
.cs .btns{display:flex;justify-content:center;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 24px;border-radius:2px;background:var(--cream);color:#111;font-weight:600;font-size:15px}
.btn.ghost{background:rgba(0,0,0,.35);color:var(--cream);border:1px solid #777}
.dots{position:absolute;z-index:5;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:7px}
.dots i{width:20px;height:2px;background:#555;transition:background .3s}
.dots i.on{background:#fff}
.sec{padding:22px 16px 0}
.sec h2{font-size:24px;line-height:1.2;margin-top:4px}
.scroller{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .poster{flex:0 0 32%}

/* page headers */
.ph{padding:40px 18px 14px;background:linear-gradient(#3a0a12,rgba(58,10,18,0))}
.ph h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:48px;line-height:1;letter-spacing:1.5px;color:#e9e4da}
.ph p{font-size:14px;color:#c9c2c4;margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 11px;border:1px solid #666;border-radius:2px;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--cream)}
.chip[aria-pressed="true"]{background:var(--cream);border-color:var(--cream);color:#111}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 12px}
.empty{padding:28px 18px;color:var(--mut);font-size:14px;line-height:1.6}
.sbox{display:flex;align-items:center;gap:10px;margin:12px 16px 4px;padding:0 14px;height:48px;border:1px solid #3a3a3a;border-radius:3px;background:rgba(255,255,255,.03);color:var(--mut)}
.sbox input{flex:1;background:none;border:0;outline:0;color:var(--cream);font:inherit;font-size:15px}
.pop{display:flex;flex-wrap:wrap;gap:10px;padding:14px 16px 4px}
.pop .chip{white-space:normal;text-transform:none;letter-spacing:.06em;padding:9px 13px;font-size:11px}
.foot{text-align:center;color:var(--mut);font-size:11px;letter-spacing:.05em;padding:32px 0 8px}

/* detail */
.dh{position:relative;height:58dvh;min-height:380px;max-height:560px}
.dh .shade{position:absolute;inset:0;z-index:2;background:linear-gradient(rgba(8,8,8,.55),transparent 22%,transparent 50%,var(--bg) 98%)}
.tb{position:absolute;z-index:5;top:16px;left:8px;right:8px;display:flex;justify-content:space-between}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.dtags{position:absolute;z-index:4;left:16px;right:16px;bottom:6px;display:flex;gap:6px}
.tag{max-width:98px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 7px;background:rgba(90,90,90,.65);border:1px solid rgba(255,255,255,.28);border-radius:2px;font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.dbody{padding:6px 16px 0}
.dbody h1{font-size:31px;line-height:1.15;margin:8px 0 10px}
.epc{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.epc svg{color:var(--red)}
.acts{display:flex;gap:10px;margin:18px 0 22px}
.acts .btn{flex:1;height:52px;font-size:13px;letter-spacing:.1em}
.sq{width:64px;height:52px;border:1px solid #444;border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--cream)}
.sq[aria-pressed="true"]{color:var(--red)}
.story{font-size:15px;line-height:1.65;color:#d3cfd0;margin-top:10px}
.eph{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.eph b{font-size:15px;font-weight:600;letter-spacing:.02em}
.eph span{font-size:12px;color:var(--mut)}
.eps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ep{position:relative;aspect-ratio:16/25;border-radius:3px;overflow:hidden;background:linear-gradient(#151515,#0b0b0b);display:block}
.ep img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ep span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:10px;font-weight:600;letter-spacing:.1em;text-shadow:0 1px 3px #000;z-index:2}
.ep.cur{outline:2px solid var(--red)}

/* nav */
.nav{position:fixed;z-index:30;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),456px);height:62px;display:flex;align-items:center;justify-content:space-around;background:rgba(22,22,22,.96);border:1px solid #262626;border-radius:34px;backdrop-filter:blur(10px)}
.nav.hide{display:none}
.ni{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 12px 4px;border-radius:16px;color:#7c7c7c;font-size:10px;font-weight:500}
.ni.on{background:#2c2c2c;color:#fff;font-weight:600}
.ni svg{width:22px;height:22px}
.play{width:52px;height:52px;border-radius:50%;background:var(--cream);color:#111;display:flex;align-items:center;justify-content:center}
.play.red{background:var(--red);color:#fff}

/* reels */
.reels{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}
.reels::-webkit-scrollbar{display:none}
.reel{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.reel .shade{position:absolute;inset:0;z-index:3;background:linear-gradient(rgba(0,0,0,.35),transparent 20%,transparent 55%,rgba(0,0,0,.85))}
.reel .hbtn{top:calc(16px + env(safe-area-inset-top));left:12px;width:32px;height:32px;z-index:5}
.reel .shr{position:absolute;z-index:5;top:calc(12px + env(safe-area-inset-top));right:8px}
.reel .inf{position:absolute;z-index:5;left:20px;right:70px;bottom:114px}
.reel .inf h2{font-size:26px;line-height:1.2;margin:6px 0 16px}
.reel .rp{position:absolute;z-index:5;left:14px;right:14px;bottom:88px;height:2px;background:rgba(255,255,255,.18)}
.reel .rp b{display:block;height:100%;width:0;background:var(--red)}
.spin{position:absolute;z-index:4;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border:3px solid #fff;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* player */
.pl{position:relative;height:100dvh;background:#000;overflow:hidden}
.pl video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.ui{position:absolute;inset:0;z-index:5;transition:opacity .25s}
.ui.off{opacity:0;pointer-events:none}
.pl-top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:6px;right:6px;display:flex;align-items:center}
.pl-top .g{flex:1}
.pl-logo{position:absolute;top:calc(64px + env(safe-area-inset-top));right:14px;display:flex;gap:4px;font-size:6px;font-weight:600;line-height:1.2;letter-spacing:.06em}
.pl-logo i{width:2px;background:var(--red)}
.pl-mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:22px}
.pl-mid button{color:#fff;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.pl-mid button:disabled{color:#555}
.pl-mid .pp{width:74px;height:74px;border-radius:50%;background:rgba(243,238,230,.95);color:#111}
.pl-bot{position:absolute;left:14px;right:14px;bottom:calc(28px + env(safe-area-inset-bottom))}
.pl-bot h1{font-size:20px;line-height:1.25}
.pl-bot .e{font-size:13px;font-weight:500;margin-top:2px}
.tm{display:flex;justify-content:space-between;font-size:11px;margin:14px 0 6px;color:#ddd}
.bar{position:relative;height:10px;border-radius:5px;background:#555;cursor:pointer}
.bar b{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--red);border-radius:5px}
.bar::before{content:"";position:absolute;left:-2px;top:-8px;width:3px;height:26px;background:var(--red)}
.pmsg{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;color:#aaa;font-size:15px;line-height:1.6}

/* toast */
.toast{position:fixed;z-index:70;left:50%;bottom:96px;transform:translateX(-50%);width:min(calc(100% - 24px),456px);padding:14px 16px;background:#e6e1e6;color:#1a1a1a;border-radius:3px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.sp-in b{animation:none;clip-path:none}.sp-in u{animation:none;width:96px}.splash{transition:none}}
</style>
</head>

<script>

const IMAGE_DIR = 'images/';                                  // covers: images/<cover>.png|jpg|webp
const VIDEO_DIR = 'videos/';                                  // episodes: videos/<id>/<n>.mp4, thumbs: videos/<id>/<n>.jpg
const episodeUrl = (d, n) => `${VIDEO_DIR}${d.id}/${n}.mp4`;

/* ===== Catalog =====
   Starts with the 10 dramas from the Android app's seed list.
   If a dramas.json file sits next to this page, it replaces this list (same fields). */
const D = (id, title, cover, eps, tags, cat, rating, views, desc) =>
  ({ id, title, cover, eps, tags: tags.toLowerCase().split(','), cat, rating, views, desc });
let DRAMAS = [
 D("mafia_don_wife","The Mafia Don Hired Me as His Wife","mafia_don_cover_1789802199526",143,"CONTRACT LOVE,FAMILY DRAMA,SWEET ROMANCE","TRENDING",4.9,3820000,"Dumped by her ex-husband for her looks and left with little money, Nora responds to a “step-mother wanted” notice and arrives at Mafia boss Luca’s estate. She enters a contractual marriage with him to soothe his traumatized young son Leo. While helping Leo regain security, Nora heals her own low self-worth, and sincere romantic feelings slowly develop between Nora and Luca."),
 D("she_quit_140m","She Quit and Took the 140M Deal","business_romance_cover_1789802210713",88,"CEO,BILLIONAIRE,REVENGE,SWEET LOVE","NEW",4.8,2100000,"Dumped by her ungrateful executive fiancé after securing the mega-corporation's landmark $140M takeover, senior strategist Maya hands in her resignation. She joins hands with the enigmatic venture capitalist billionaire Vincent Vance, triggering high-stakes corporate warfare and irresistible mutual attraction."),
 D("dragon_queen","Kneel Before The Dragon Queen","dragon_queen_cover_1789802223760",60,"FANTASY,DRAGON,ROYALTY,MAGIC","FANTASY",4.9,4500000,"Cast into exile as a disgraced princess on a misty medieval dock, Valery awakens the legendary silver Storm Dragon from the abyssal ocean. Returning to the imperial high court, she forces the treacherous usurpers to kneel beneath roaring dragon fire."),
 D("divine_mage","The Exiled Heir Is the Divine Mage","divine_mage_cover_1789802233959",54,"FANTASY,ACTION,MARTIAL ARTS,REBIRTH","HOTLIST",4.7,1890000,"Valdon was stripped of his royal birthright and tossed into the gladiatorial colosseum arena to perish. What his treacherous brothers did not foresee is that the ancient celestial mage dynasty bloodline awoke within him."),
 D("weakest_bastard","Weakest Bastard Shakes the World","divine_mage_cover_1789802233959",45,"MARTIAL ARTS,REVENGE,LEVEL UP","HOTLIST",4.9,3100000,"Born without a spiritual core and mocked by his entire sect as useless trash, a sudden celestial strike awakens an ancient forbidden god realm within his soul."),
 D("billion_dollar_empire","Billion Dollar Empire: Stolen Heir","business_romance_cover_1789802210713",53,"CEO,FAMILY DRAMA,REVENGE,SWEET ROMANCE","TRENDING",4.6,1450000,"Swapped in the maternity ward 25 years ago, a humble delivery driver discovers he is the sole heir to Manhattan's wealthiest family estate."),
 D("outcast_queen","The Rise of the Outcast Queen","mafia_don_cover_1789802199526",65,"ROYALTY,PALACE,DRAMA,LOVE","NEW",4.8,2800000,"A castaway maiden disguised as a royal scribe outsmarts political court assassins to claim her rightful throne and capture the heart of the emperor."),
 D("hired_killer_dad","I Hired a Killer to Be My Dad","mafia_don_cover_1789802199526",32,"FAMILY,COMEDY,SUSPENSE,PROTECTION","HOTLIST",4.9,5200000,"Tired of being targeted by school bullies, 8-year-old Toby used his entire piggy bank savings to hire the underworld's most feared phantom hitman as his surrogate father."),
 D("boxing_champion","The 7-Year-Old Boxing Champion","divine_mage_cover_1789802233959",59,"ACTION,INSPIRATIONAL,FAMILY","TRENDING",4.7,1950000,"Born with legendary martial instincts, a tiny prodigy steps into the underground ring to save his injured father's boxing gym from corrupt syndicate bosses."),
 D("contract_wife_don","The Don's Contract Wife to True Heiress","mafia_don_cover_1789802199526",56,"CONTRACT LOVE,MAFIA,HEIRESS,ROMANCE","NEW",4.9,4100000,"Bound by a 1-year secret marriage agreement with the fearsome head of the Luciano family, she conceals her true identity as the world's most elusive diamond heiress.")
];

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const app = $('#app');
const byId = id => DRAMAS.find(d => d.id === id);
const hue = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
const grad = d => { const h = hue(d.id); return `linear-gradient(160deg,hsl(${h} 45% 24%),hsl(${(h + 50) % 360} 50% 9%))`; };
const P = {
 home:'<path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/>',

 back:'<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>',
 queue:'<path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>',
 gear:'<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>',
 prev:'<path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>',

 rew:'<path d="M12 5V1L7 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/><text x="12" y="16.200" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" font-family="Outfit,sans-serif">10</text>',
 fwd:'<path transform="translate(24 0) scale(-1 1)" d="M12 5V1L7 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/><text x="12" y="16.200" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" font-family="Outfit,sans-serif">10</text>'
};
const ic = (n, s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${P[n]}</svg>`;

function imgFix(el) {
  const ex = ['png', 'jpg', 'jpeg', 'webp'], i = +el.dataset.i || 0;
  if (i < ex.length - 1) { el.dataset.i = i + 1; el.src = `${IMAGE_DIR}${el.dataset.n}.${ex[i + 1]}`; } else el.remove();
}
const imgTag = d => `<img src="${IMAGE_DIR}${d.cover}.png" data-n="${d.cover}" data-i="0" alt="" loading="lazy" onerror="imgFix(this)">`;
const cover = (d, fill) => `<div class="cover${fill ? ' fill' : ''}" style="--g:${grad(d)}"><span class="t">${d.title}</span>${imgTag(d)}</div>`;

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2000); }
async function shareIt(id) {
  const d = byId(id), url = `${location.origin}${location.pathname}#/drama/${id}`;
  try { if (navigator.share) { await navigator.share({ title: d.title, url }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch (e) { toast(url); }
}

/* ===== Saved state (favorites + watch progress, on this device) ===== */
const load = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch (e) { return f; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let favs = new Set(load('sd_favs', []));
let prog = load('sd_prog', {});
const isFav = id => favs.has(id);
const heartBtn = (d, cls = 'hbtn', sz = 22) => `<button class="${cls}" data-fav="${d.id}" data-sz="${sz}" aria-pressed="${isFav(d.id)}" aria-label="Save to My List" onclick="toggleFav(event,'${d.id}')">${ic(isFav(d.id) ? 'heartF' : 'heart', sz)}</button>`;
function toggleFav(e, id) {
  e && e.stopPropagation();
  isFav(id) ? favs.delete(id) : favs.add(id);
  save('sd_favs', [...favs]);
  const on = isFav(id);
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b => { b.setAttribute('aria-pressed', on); b.innerHTML = ic(on ? 'heartF' : 'heart', +b.dataset.sz || 22); });
  toast(on ? 'Added to My List' : 'Removed from My List');
  if (location.hash === '#/list') views.list();
}
function rmProg(e, id) { e.stopPropagation(); delete prog[id]; save('sd_prog', prog); views.home(); }

/* ===== Cards ===== */
const poster = (d, o = {}) => `<div class="poster"><a href="#/drama/${d.id}" aria-label="${d.title}">${cover(d)}</a>${heartBtn(d)}<span class="pep">${o.ep ? 'EP ' + o.ep : d.eps + ' EP'}</span>${o.x ? `<button class="px" aria-label="Remove from Continue Watching" onclick="rmProg(event,'${d.id}')">${ic('close', 14)}</button>` : ''}${o.pct != null ? `<div class="pbar"><b style="width:${o.pct}%"></b></div>` : ''}</div>`;
const row = (kick, title, list, fn = poster) => list.length ? `<section class="sec" style="padding-bottom:0"><div class="kick">${kick}</div><h2 class="serif">${title}</h2></section><div class="scroller">${list.map(d => fn(d)).join('')}</div>` : '';

/* ===== Views ===== */
let timer;
let browseCat = 'COLLECTION', sq = '', sf = '';
const views = {
 home() {
  const feat = [...DRAMAS].sort((a, b) => b.views - a.views).slice(0, 5);
  const cont = Object.entries(prog).sort((a, b) => b[1].ts - a[1].ts).map(([id, p]) => ({ d: byId(id), p })).filter(x => x.d);
  app.innerHTML =
   `<section class="hero"><div class="track" id="track">${feat.map(d => `
     <article class="slide">${cover(d, true)}<div class="shade"></div>
      <div class="brand"><i></i><div><small>FREE</small><b>SHORT DRAMA</b><u></u></div></div>
      ${heartBtn(d)}<span class="cnt">${d.eps} EP</span>
      <div class="cs"><div class="kick">Cover story</div><div class="btns"><a class="btn" href="#/watch/${d.id}/1">${ic('tri', 18)}Play</a><a class="btn ghost" href="#/drama/${d.id}">More info</a></div></div>
     </article>`).join('')}</div><div class="dots" id="dots">${feat.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div></section>` +
   row('Resume', 'Continue Watching', cont.map(x => x.d), d => { const p = prog[d.id]; return poster(d, { ep: p.ep, x: 1, pct: p.d ? Math.min(100, Math.round(p.t / p.d * 100)) : 0 }); }) +
   row('This week', 'Trending Now', DRAMAS.filter(d => d.cat === 'TRENDING')) +
   row('Just dropped', 'New Releases', DRAMAS.filter(d => d.cat === 'NEW')) +
   row('The edit', 'Hot List', DRAMAS.filter(d => d.cat === 'HOTLIST')) +
   row('By genre', 'Fantasy', DRAMAS.filter(d => d.cat === 'FANTASY'));
  const tr = $('#track'), dots = [...document.querySelectorAll('#dots i')];
  const cur = () => Math.round(tr.scrollLeft / tr.clientWidth);
  tr.addEventListener('scroll', () => { const c = cur(); dots.forEach((x, i) => x.classList.toggle('on', i === c)); }, { passive: true });
  timer = setInterval(() => { tr.scrollTo({ left: ((cur() + 1) % feat.length) * tr.clientWidth, behavior: 'smooth' }); }, 6000);
 },
 search() {
  app.innerHTML = `<div class="ph"><h1>Search</h1><p>Titles, genres, moods</p></div>
   <label class="sbox">${ic('search', 22)}<input id="q" type="search" placeholder="Titles, genres, moods..." autocomplete="off" aria-label="Search"></label><div id="sres"></div>`;
  const q = $('#q'); q.value = sq;
  q.addEventListener('input', () => { sq = q.value; drawSearch(); });
  drawSearch();
 },
 browse() {
  const cats = ['COLLECTION', 'NEW', 'HOTLIST', 'FANTASY', 'ASIA', 'FEMALE', 'MALE'];
  const list = browseCat === 'COLLECTION' ? DRAMAS : DRAMAS.filter(d => d.cat === browseCat);
  app.innerHTML = `<div class="ph"><h1>Browse</h1><p>Channels · curated shelves</p></div>
   <div class="chips">${cats.map(c => `<button class="chip" aria-pressed="${c === browseCat}" onclick="browseCat='${c}';views.browse()">${c}</button>`).join('')}</div>` +
   (list.length ? `<div class="g3">${list.map(d => poster(d)).join('')}</div>` : '<p class="empty">Nothing on this shelf yet. Check back soon.</p>');
 },
 list() {
  const l = DRAMAS.filter(d => favs.has(d.id));
  app.innerHTML = `<div class="ph"><h1>My List</h1><p>Favorites &amp; saved episodes</p></div>
   <section class="sec" style="padding-top:8px"><div class="kick">Your list</div><h2 class="serif" style="margin-bottom:12px">Favorites</h2></section>` +
   (l.length ? `<div class="g3">${l.map(d => poster(d)).join('')}</div>` : '<p class="empty">Nothing saved yet. Tap the heart on any drama and it will show up here. Your list is kept on this device.</p>') +
   `<p class="foot">Free Short Drama · Web</p>`;
 },
 drama(id) {
  const d = byId(id); if (!d) return notFound();
  const p = prog[id], resume = p && (p.ep > 1 || p.t > 5);
  document.title = `${d.title} · Free Short Drama`;
  app.innerHTML = `<section class="dh">${cover(d, true)}<div class="shade"></div>
    <div class="tb"><a class="ib" href="#/home" aria-label="Back">${ic('back', 26)}</a><button class="ib" aria-label="Share" onclick="shareIt('${d.id}')">${ic('share', 22)}</button></div>
    <div class="dtags">${d.tags.slice(0, 3).map(t => `<span class="tag">${t}</span>`).join('')}</div></section>
   <div class="dbody"><h1 class="serif">${d.title}</h1><div class="epc">${ic('tri', 14)}${d.eps} Episodes</div>
    <div class="acts"><a class="btn" href="#/watch/${d.id}/${resume ? p.ep : 1}">${ic('tri', 18)}${resume ? 'Resume EP ' + p.ep : 'Play'}</a>${heartBtn(d, 'sq', 26)}</div>
    <div class="kick">Storyline</div><p class="story">${d.desc}</p>
    <div class="eph"><b>EPISODES</b><span>${d.eps} Clips</span></div>
    <div class="eps">${Array.from({ length: d.eps }, (_, i) => `<a class="ep${p && p.ep === i + 1 ? ' cur' : ''}" href="#/watch/${d.id}/${i + 1}"><img src="${thumbUrl(d, i + 1)}" alt="" loading="lazy" onerror="this.remove()"><span>EP ${i + 1}</span></a>`).join('')}</div></div>`;
 },
 watch(id, n) {
  const d = byId(id); if (!d) return notFound();
  n = Math.min(Math.max(parseInt(n) || 1, 1), d.eps);
  document.title = `${d.title} · Episode ${n}`;
  const go = k => { location.hash = `#/watch/${d.id}/${k}`; };
  app.innerHTML = `<div class="pl" id="pl"><video id="v" playsinline autoplay src="${episodeUrl(d, n)}"></video>
   <div class="pmsg" id="pm" hidden>This episode isn't available yet.<br>Please try another episode.</div>
   <div class="ui" id="ui">
    <div class="pl-top"><a class="ib" href="#/drama/${d.id}" aria-label="Back">${ic('back', 26)}</a><span class="g"></span><button class="ib" aria-label="Share" onclick="shareIt('${d.id}')">${ic('share', 22)}</button><a class="ib" href="#/drama/${d.id}" aria-label="All episodes">${ic('queue', 24)}</a><button class="ib" id="spd" aria-label="Playback speed">${ic('gear', 24)}</button></div>
    <div class="pl-logo"><i></i><span>FREE<br>SHORT DRAMA</span></div>
    <div class="pl-mid"><button id="pv" aria-label="Previous episode" ${n > 1 ? '' : 'disabled'}>${ic('prev', 28)}</button><button id="rw" aria-label="Back 10 seconds">${ic('rew', 34)}</button><button class="pp" id="pp" aria-label="Play or pause">${ic('pause', 34)}</button><button id="fw" aria-label="Forward 10 seconds">${ic('fwd', 34)}</button><button id="nx" aria-label="Next episode" ${n < d.eps ? '' : 'disabled'}>${ic('next', 28)}</button></div>
    <div class="pl-bot"><h1 class="serif">${d.title}</h1><div class="e">Episode ${n}/${d.eps}</div><div class="tm"><span id="cu">0:00</span><span id="du">0:00</span></div><div class="bar" id="bar"><b id="fl"></b></div></div>
   </div></div>`;
  const v = $('#v'), ui = $('#ui'), pp = $('#pp'), fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00';
  let hideT, lastSave = 0;
  const showUI = () => { ui.classList.remove('off'); clearTimeout(hideT); if (!v.paused) hideT = setTimeout(() => ui.classList.add('off'), 3200); };
  $('#pl').addEventListener('click', e => { if (e.target.closest('button,a,.bar')) return; ui.classList.contains('off') ? showUI() : ui.classList.add('off'); });
  pp.onclick = () => { v.paused ? v.play() : v.pause(); showUI(); };
  $('#rw').onclick = () => { v.currentTime = Math.max(0, v.currentTime - 10); showUI(); };
  $('#fw').onclick = () => { v.currentTime = Math.min(v.duration || 1e9, v.currentTime + 10); showUI(); };
  $('#pv').onclick = () => go(n - 1);
  $('#nx').onclick = () => go(n + 1);
  const rates = [1, 1.25, 1.5, 2]; let ri = 0;
  $('#spd').onclick = () => { ri = (ri + 1) % rates.length; v.playbackRate = rates[ri]; toast(`Speed ${rates[ri]}x`); showUI(); };
  $('#bar').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); if (v.duration) v.currentTime = (e.clientX - r.left) / r.width * v.duration; showUI(); };
  v.addEventListener('loadedmetadata', () => {
    $('#du').textContent = fmt(v.duration);
    const p = prog[d.id]; if (p && p.ep === n && p.t > 3 && p.t < v.duration - 3) v.currentTime = p.t;
  });
  v.addEventListener('timeupdate', () => {
    $('#cu').textContent = fmt(v.currentTime);
    $('#fl').style.width = (v.duration ? v.currentTime / v.duration * 100 : 0) + '%';
    if (Date.now() - lastSave > 2000 && v.currentTime > 1) { lastSave = Date.now(); prog[d.id] = { ep: n, t: v.currentTime, d: v.duration || 0, ts: Date.now() }; save('sd_prog', prog); }
  });
  v.addEventListener('play', () => { pp.innerHTML = ic('pause', 34); showUI(); });
  v.addEventListener('pause', () => { pp.innerHTML = ic('tri', 38); showUI(); });
  v.addEventListener('ended', () => { if (n < d.eps) go(n + 1); });
  v.addEventListener('error', () => { v.hidden = true; $('#pm').hidden = false; ui.classList.remove('off'); });
  v.play().catch(() => { pp.innerHTML = ic('tri', 38); });
  showUI();
 },
 reels() {
  document.title = 'For You · Free Short Drama';
  app.innerHTML = `<div class="reels" id="reels">${[...DRAMAS].sort((a, b) => b.views - a.views).map(d => `
   <article class="reel" data-id="${d.id}">${cover(d, true)}
    <video muted loop playsinline preload="none" data-src="${episodeUrl(d, 1)}"></video><div class="spin" hidden></div><div class="shade"></div>
    ${heartBtn(d, 'hbtn', 26)}<button class="ib shr" aria-label="Share" onclick="shareIt('${d.id}')">${ic('share', 22)}</button>
    <div class="inf"><div class="kick">For you</div><h2 class="serif">${d.title}</h2><a class="btn" href="#/watch/${d.id}/1">${ic('tri', 18)}Watch series</a></div>
    <div class="rp"><b></b></div></article>`).join('')}</div>`;
  const root = $('#reels');
  const io = new IntersectionObserver(es => es.forEach(e => {
   const v = e.target.querySelector('video'), sp = e.target.querySelector('.spin');
   if (!v) return;
   if (e.isIntersecting) { if (!v.src) { v.src = v.dataset.src; sp.hidden = false; } v.play().catch(() => {}); } else v.pause();
  }), { root, threshold: .6 });
  root.querySelectorAll('.reel').forEach(r => {
   const v = r.querySelector('video'), sp = r.querySelector('.spin'), b = r.querySelector('.rp b');
   io.observe(r);
   v.addEventListener('playing', () => { sp.hidden = true; });
   v.addEventListener('error', () => { sp.remove(); v.remove(); });
   v.addEventListener('timeupdate', () => { b.style.width = (v.duration ? v.currentTime / v.duration * 100 : 0) + '%'; });
   r.addEventListener('click', e => { if (e.target.closest('button,a')) return; v.paused ? v.play() : v.pause(); });
  });
 }
};
function drawSearch() {
  const el = $('#sres'); if (!el) return;
  const s = sq.trim().toLowerCase();
  const filters = ['Recommend', 'NEW', 'Female', 'Male'];
  let list = null;
  if (s) list = DRAMAS.filter(d => (d.title + ' ' + d.tags.join(' ') + ' ' + d.cat + ' ' + d.desc).toLowerCase().includes(s));
  if (sf === 'Recommend') list = (list || DRAMAS).filter(d => d.rating >= 4.8).sort((a, b) => b.rating - a.rating);
  else if (sf) list = (list || DRAMAS).filter(d => d.cat === sf.toUpperCase());
  const chips = `<div class="chips" style="padding-top:8px">${filters.map(f => `<button class="chip" aria-pressed="${f === sf}" onclick="sf=(sf==='${f}'?'':'${f}');drawSearch()">${f}</button>`).join('')}</div>`;
  if (list === null) {
    const pop = [...DRAMAS].sort((a, b) => b.views - a.views).slice(0, 9);
    el.innerHTML = `<section class="sec" style="padding-top:20px"><div class="kick">Trending searches</div><h2 class="serif">Popular right now</h2></section>
      <div class="pop">${pop.map(d => `<button class="chip" onclick="sq=this.textContent;$('#q').value=sq;drawSearch()">${d.title}</button>`).join('')}</div>${chips}`;
  } else {
    el.innerHTML = `${chips}` + (list.length ? `<div class="g3">${list.map(d => poster(d)).join('')}</div>` : '<p class="empty">No dramas match yet. Try a title, a genre like fantasy, or a mood like revenge.</p>');
  }
}
function notFound() {
  app.innerHTML = '<div class="ph"><h1>Not found</h1></div><p class="empty">This link may be old or mistyped.</p><div style="padding:0 18px"><a class="btn" href="#/home">Back to Home</a></div>';
}

/* ===== Navigation + router ===== */
function drawNav(active) {
  const it = (v, label) => `<a class="ni${active === v ? ' on' : ''}" href="#/${v}">${ic(v === 'list' ? 'list' : v, 22)}<span>${label}</span></a>`;
  $('#nav').innerHTML = it('home', 'Home') + it('search', 'Search') + `<a class="play${active === 'reels' ? ' red' : ''}" href="#/reels" aria-label="For You">${ic('tri', 30)}</a>` + it('browse', 'Browse') + it('list', 'List');
}
function route() {
  clearInterval(timer);
  const [v = 'home', a, b] = (location.hash.slice(2) || 'home').split('/');
  const full = v === 'drama' || v === 'watch';
  document.body.classList.toggle('lock', v === 'reels' || v === 'watch');
  app.classList.toggle('bare', v === 'reels' || v === 'watch');
  $('#nav').classList.toggle('hide', full);
  drawNav(v);
  const titles = { home: 'Free Short Drama', search: 'Search', browse: 'Browse', list: 'My List' };
  if (titles[v]) document.title = titles[v] + (v === 'home' ? '' : ' · Free Short Drama');
  (views[v] || views.home)(a, b);
  if (v !== 'reels') window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

(async function init() {
  try { const r = await fetch('dramas.json', { cache: 'no-cache' }); if (r.ok) { const j = await r.json(); if (Array.isArray(j) && j.length) DRAMAS = j; } } catch (e) {}
  route();
  let seen = false; try { seen = sessionStorage.getItem('sd_splash'); sessionStorage.setItem('sd_splash', '1'); } catch (e) {}
  if (!seen && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const s = document.createElement('div'); s.className = 'splash';
    s.innerHTML = '<div class="sp-in"><i class="sp-bar"></i><div><small>FREE</small><b>SHORT DRAMA</b><u></u></div></div>';
    document.body.appendChild(s);
    setTimeout(() => s.classList.add('out'), 2100);
    setTimeout(() => s.remove(), 2700);
  }
})();
</script>
